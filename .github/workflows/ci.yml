name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发：用于按需构建各平台可执行文件（见 build-macos / build-linux）
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: 格式检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy（严格 lints）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  miri:
    name: Miri（FFI 边界 UB 检查）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      # 仅对不触碰数据库的 FFI 边界测试运行（SQLite 为 C 实现，Miri 无法解释）
      - env:
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check"
        run: cargo miri test -p vault_ffi --test ffi_safety

  ffi-abi:
    name: FFI C ABI 冒烟（模拟外部调用方）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建并准备测试库
        run: |
          cargo build -p vault_ffi -p vault_cli
          printf '测试站点\n账号：smoke_user\n密码：Smoke#123\n二级密码：888444\n' > /tmp/smoke.txt
          printf '%s' 'smoke-master-12345' > /tmp/pw.txt
          cargo run -q -p vault_cli -- import --db /tmp/abis.db --text /tmp/smoke.txt --password-file /tmp/pw.txt
      - name: 编译并运行 C ABI 冒烟测试
        run: |
          cc vault_ffi/tests/c_abi_smoke.c -Ltarget/debug -lvault_ffi -lpthread -ldl -lm -o /tmp/abi_smoke
          LD_LIBRARY_PATH=target/debug /tmp/abi_smoke /tmp/abis.db smoke-master-12345

  build-macos:
    name: 构建 macOS ARM64 可执行文件（手动触发）
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 编译
        run: cargo build --release --bin vault_web --bin vault_cli --bin recovery_service
      - name: 打包产物
        run: |
          mkdir -p dist
          cp target/release/vault_web target/release/vault_cli target/release/recovery_service dist/
          tar -czf fuxipass-macos-arm64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: fuxipass-macos-arm64
          path: fuxipass-macos-arm64.tar.gz
          retention-days: 30

  build-linux:
    name: 构建 Linux x86_64 可执行文件（手动触发）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 编译
        run: cargo build --release --bin vault_web --bin vault_cli --bin recovery_service
      - name: 打包产物
        run: |
          mkdir -p dist
          cp target/release/vault_web target/release/vault_cli target/release/recovery_service dist/
          tar -czf fuxipass-linux-x86_64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: fuxipass-linux-x86_64
          path: fuxipass-linux-x86_64.tar.gz
          retention-days: 30
