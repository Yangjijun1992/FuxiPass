[package]
name = "vault_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "安全密码管家移动端 FFI 层（C ABI，供 Flutter / Android / iOS 调用）"

[lib]
# rlib 供 Rust 侧测试与桌面端集成；cdylib 供 Android (.so)；staticlib 供 iOS (.a)
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
vault_store = { path = "../vault_store" }
serde_json = "1"

[dev-dependencies]
security_core = { path = "../security_core" }
base64 = "0.22"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
