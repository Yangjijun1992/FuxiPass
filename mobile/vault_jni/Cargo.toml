[package]
name = "vault_jni"
version.workspace = true
edition = "2021"
description = "Android JNI 桥接：把 vault_store 暴露给 Kotlin/Java（Mate 50 当前 HarmonyOS 3/4 = APK 路径）"
license.workspace = true

[lib]
crate-type = ["cdylib"]   # 产出 libvault_jni.so 供 Android 加载

[dependencies]
vault_store = { path = "../../vault_store" }
jni = "0.21"
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
