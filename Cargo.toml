[workspace]
resolver = "2"
members = ["security_core", "vault_store", "vault_web", "vault_cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
# thiserror 2.0.21 起要求 rustc 1.77；本机为 1.75，钉在 2.0.20。
thiserror = "=2.0.20"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
